name: Build and Release Wine Engine

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Bootstrap
        run: scripts/bootstrap-macos.sh

      - name: Build arm64
        run: scripts/build-arm64.sh

      - name: Build x86_64
        run: scripts/build-x86_64.sh

      - name: Package release archives
        run: scripts/package-release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/wine-macos-arm64.zip
            dist/wine-macos-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
